plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = 'hb-executor'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation project(':mod:common')
	include project(':mod:common')

	// Compile against baritone.api.* only; the full fork jar is a separate mod at runtime.
	compileOnly project(path: ':', configuration: 'baritoneApi')
	localRuntime project(path: ':', configuration: 'baritoneRuntime')

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
